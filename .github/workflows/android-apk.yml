name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "android/**"
      - "app/lib/nativeFieldTracking.js"
      - "app/components/NativeFieldTracking.jsx"
      - "capacitor.config.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Ensure Node.js 22+ for Capacitor
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Verify Node.js version
        run: |
          node --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 22) { console.error('Capacitor requires Node.js >=22'); process.exit(1); }"

      - name: Sync Capacitor Android
        run: npm exec -- cap sync android

      - name: Decode upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_BASE64 secret is not set. Building debug APK instead."
          else
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r\t ' | base64 --decode > "$RUNNER_TEMP/madiba-upload.keystore"
            test -s "$RUNNER_TEMP/madiba-upload.keystore"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/madiba-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -PmadibaVersionCode="$VERSION_CODE" \
            -PmadibaVersionName="$VERSION_NAME"

      - name: Build debug APK
        if: steps.keystore.outputs.has_keystore != 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon \
            -PmadibaVersionCode="$VERSION_CODE" \
            -PmadibaVersionName="$VERSION_NAME"

      - name: Upload release APK artifact
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: madiba-sfa-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK artifact
        if: steps.keystore.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: madiba-sfa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
