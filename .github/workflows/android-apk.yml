name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "android/**"
      - "app/lib/nativeFieldTracking.js"
      - "app/components/NativeFieldTracking.jsx"
      - "capacitor.config.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Ensure Node.js 22+ for Capacitor
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Verify Node.js version
        run: |
          node --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 22) { console.error('Capacitor requires Node.js >=22'); process.exit(1); }"

      - name: Sync Capacitor Android
        run: npm exec -- cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: madiba-sfa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
