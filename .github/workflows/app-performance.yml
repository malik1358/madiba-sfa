name: App Performance Check

on:
  schedule:
    # 09:00, 12:00, 15:00 and 18:00 Asia/Riyadh. The check still runs on Friday; the alert email does not.
    - cron: "0 6,9,12,15 * * *"
  workflow_dispatch:

permissions: {}
concurrency:
  group: app-performance-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Measure public app and store the daily sample
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi
          # Fastest of three public hits so one slow GitHub→Vercel hop does not mark the hour slower.
          external_ms=""
          for _ in 1 2 3; do
            seconds="$(curl --fail --silent --show-error --max-time 30 -o /dev/null -w '%{time_total}' 'https://madiba-sfa.vercel.app/api/build-info')"
            attempt_ms="$(awk -v seconds="$seconds" 'BEGIN { printf "%.0f", seconds * 1000 }')"
            if [[ -z "$external_ms" || "$attempt_ms" -lt "$external_ms" ]]; then
              external_ms="$attempt_ms"
            fi
          done
          response="$(curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST 'https://madiba-sfa.vercel.app/api/cron/app-performance' \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json" \
            -d "{\"external_build_info_ms\":${external_ms}}")"
          echo "$response"
          status="$(printf '%s' "$response" | jq -er 'if .success == true then .status else error("Performance check did not succeed") end')"
          case "$status" in
            baseline|collecting|steady)
              ;;
            slower)
              echo "::warning::App performance is slower than its historical baseline. Measurements were stored; see the response above for email delivery status."
              ;;
            error)
              echo "::error::App performance probes failed."
              exit 1
              ;;
            *)
              echo "::error::Invalid app performance status."
              exit 1
              ;;
          esac
