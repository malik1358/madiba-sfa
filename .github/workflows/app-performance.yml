name: App Performance Check

on:
  schedule:
    # 05:30 Asia/Riyadh every day, including Friday.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions: {}
concurrency:
  group: app-performance-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Measure public app and store the daily sample
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi
          seconds="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{time_total}' 'https://madiba-sfa.vercel.app/api/build-info')"
          external_ms="$(awk -v seconds="$seconds" 'BEGIN { printf "%.0f", seconds * 1000 }')"
          response="$(curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST 'https://madiba-sfa.vercel.app/api/cron/app-performance' \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json" \
            -d "{\"external_build_info_ms\":${external_ms}}")"
          echo "$response"
          status="$(printf '%s' "$response" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')"
          if [[ "$status" == "slower" || "$status" == "error" ]]; then
            echo "Daily app performance status is $status"
            exit 1
          fi
