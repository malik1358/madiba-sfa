name: Copy payment files to R2

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Copy, verify, then reconcile payment files
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi
          post() {
            local mode="$1"
            curl -sS -L --post301 --post302 --post303 --max-time 75 -o response.json -w "%{http_code}" -X POST \
              "https://madiba-sfa.vercel.app/api/cron/copy-payment-copies-to-r2" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data "{\"mode\":\"${mode}\"}"
          }
          run_mode() {
            local mode="$1"
            local i code status attempt
            for i in $(seq 1 80); do
              for attempt in 1 2 3 4 5 6; do
                set +e
                code="$(post "$mode")"
                status=$?
                set -e
                if [[ "$status" != "0" ]]; then
                  code="000"
                fi
                echo "mode=${mode} batch=${i} attempt=${attempt} http=${code}"
                if [[ "$code" == "502" || "$code" == "503" || "$code" == "504" || "$code" == "000" ]]; then
                  echo "gateway timeout; saved progress will be resumed"
                  sleep 8
                  continue
                fi
                set +e
                node --input-type=module -e "import fs from 'node:fs'; const raw=fs.readFileSync('response.json','utf8'); let body; try { body=JSON.parse(raw); } catch { console.log(raw.slice(0,180)); process.exit(4); } const results=(body.results||[]).map((item)=>({file:item.file,ok:item.ok,association:item.association,kind:item.kind,bytes:item.bytes,reasons:item.reasons,verifiedAtSet:item.verifiedAtSet})); console.log(JSON.stringify({success:body.success,done:body.done,stop:body.stop,stopReason:body.stopReason,mode:body.mode,sourceCount:body.sourceCount,copied:body.copied,already:body.already,failed:body.failed,verifiedRows:body.verifiedRows,verifiedCount:body.verifiedCount,reconciledCount:body.reconciledCount,remaining:body.remaining,checked:body.checked,verified:body.verified,batchAttempted:body.batchAttempted,error:body.error,failures:(body.failures||[]).slice(0,5),results})); if(body.stop) process.exit(2); if(body.success && (body.mode==='verify-new' || body.remaining===0)) process.exit(0); if(body.success) process.exit(3); process.exit(1);"
                status=$?
                set -e
                if [[ "$status" == "4" ]]; then
                  echo "response was not JSON; retrying"
                  sleep 8
                  continue
                fi
                if [[ "$status" == "0" ]]; then
                  return 0
                fi
                if [[ "$status" == "3" ]]; then
                  break
                fi
                return "$status"
              done
              if [[ "$status" == "3" ]]; then
                continue
              fi
              echo "${mode} batch ${i} failed after retries"
              return 1
            done
            echo "${mode} did not finish"
            return 1
          }
          run_mode copy
          run_mode reconcile
          run_mode verify-new
