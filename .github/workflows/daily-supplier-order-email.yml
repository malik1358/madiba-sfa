name: Daily Supplier Order Email

on:
  schedule:
    # 21:20 UTC = 00:20 KSA — previous KSA day's orders to each salesman (bosses on CC).
    # Skips Friday holiday the same way as daily visit report (Sun–Thu + Sat).
    - cron: "20 21 * * 0-3,5,6"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date YYYY-MM-DD (KSA). Empty = previous KSA day for cron logic."
        required: false
        default: ""
      to:
        description: "Test-only recipient override (skips salesmen + default digest list)."
        required: false
        default: ""
      force:
        description: "Force send even if already marked sent"
        required: false
        default: "true"

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily supplier order email endpoint
        env:
          DAILY_SUPPLIER_ORDER_EMAIL_URL: ${{ secrets.DAILY_SUPPLIER_ORDER_EMAIL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_TO: ${{ github.event.inputs.to }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          DEFAULT_DAILY_SUPPLIER_ORDER_EMAIL_URL='https://madiba-sfa.vercel.app/api/cron/daily-supplier-order-email'
          DAILY_SUPPLIER_ORDER_EMAIL_URL_TRIMMED="$(printf '%s' "$DAILY_SUPPLIER_ORDER_EMAIL_URL" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE="$DAILY_SUPPLIER_ORDER_EMAIL_URL_TRIMMED"

          if [[ -z "$DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE" ]]; then
            echo "DAILY_SUPPLIER_ORDER_EMAIL_URL secret is missing; falling back to default endpoint."
            DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE="$DEFAULT_DAILY_SUPPLIER_ORDER_EMAIL_URL"
          elif [[ ! "$DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE" =~ /api/cron/daily-supplier-order-email([/?].*)?$ ]]; then
            echo "DAILY_SUPPLIER_ORDER_EMAIL_URL secret does not point to /api/cron/daily-supplier-order-email; falling back to default endpoint."
            DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE="$DEFAULT_DAILY_SUPPLIER_ORDER_EMAIL_URL"
          fi

          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          CRON_SECRET_TRIMMED="$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          export EVENT_NAME
          export FORCE_VALUE="${INPUT_FORCE:-}"
          export DATE_VALUE="$(printf '%s' "$INPUT_DATE" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export TO_VALUE="$(printf '%s' "$INPUT_TO" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          python3 - <<'PY' > payload.json
          import json, os
          event_name = os.environ.get("EVENT_NAME", "").strip()
          force_raw = os.environ.get("FORCE_VALUE", "").strip().lower()
          if event_name == "schedule":
            force = False
          elif force_raw:
            force = force_raw not in ("0", "false", "no")
          else:
            force = True
          payload = {"force": force}
          date = os.environ.get("DATE_VALUE", "").strip()
          to = os.environ.get("TO_VALUE", "").strip()
          if date:
            payload["date"] = date
          if to:
            payload["to"] = to
            payload["sendToUsers"] = False
          print(json.dumps(payload))
          PY

          echo "Request payload:"
          cat payload.json

          post_report() {
            local target_url="$1"
            curl -sS -L --post301 --post302 --post303 --max-time 180 -o response.json -w "%{http_code}" -X POST "$target_url" \
              -H "x-cron-secret: $CRON_SECRET_TRIMMED" \
              -H "Content-Type: application/json" \
              --data @payload.json
          }

          status_code="$(post_report "$DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE")"

          if [[ ("$status_code" -lt 200 || "$status_code" -ge 300) && "$DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE" != "$DEFAULT_DAILY_SUPPLIER_ORDER_EMAIL_URL" ]]; then
            echo "Primary DAILY_SUPPLIER_ORDER_EMAIL_URL failed with HTTP $status_code; retrying default endpoint."
            DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE="$DEFAULT_DAILY_SUPPLIER_ORDER_EMAIL_URL"
            status_code="$(post_report "$DAILY_SUPPLIER_ORDER_EMAIL_URL_EFFECTIVE")"
          fi

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            echo "Daily supplier order email failed with HTTP $status_code"
            cat response.json
            exit 1
          fi

          echo "Daily supplier order email succeeded with HTTP $status_code"
          cat response.json
