name: Daily Visit Report Email

on:
  schedule:
    # 05:30 UTC = 08:30 KSA, Saturday–Thursday.
    # Thursday's report still goes Saturday morning because Friday is the holiday.
    - cron: "30 5 * * 0-4,6"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date YYYY-MM-DD (blank = previous working day)"
        required: false
        default: ""
      digestOnlyTo:
        description: "Optional single inbox for company digest only (skips salesman/boss mail)"
        required: false
        default: ""

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily visit report email endpoint
        env:
          DAILY_VISIT_REPORT_EMAIL_URL: ${{ secrets.DAILY_VISIT_REPORT_EMAIL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REPORT_DATE: ${{ github.event.inputs.date }}
          DIGEST_ONLY_TO: ${{ github.event.inputs.digestOnlyTo }}
        run: |
          DEFAULT_DAILY_VISIT_REPORT_EMAIL_URL='https://madiba-sfa.vercel.app/api/cron/daily-visit-report-email'
          DAILY_VISIT_REPORT_EMAIL_URL_TRIMMED="$(printf '%s' "$DAILY_VISIT_REPORT_EMAIL_URL" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE="$DAILY_VISIT_REPORT_EMAIL_URL_TRIMMED"

          if [[ -z "$DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE" ]]; then
            echo "DAILY_VISIT_REPORT_EMAIL_URL secret is missing; falling back to default endpoint."
            DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE="$DEFAULT_DAILY_VISIT_REPORT_EMAIL_URL"
          elif [[ ! "$DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE" =~ /api/cron/daily-visit-report-email([/?].*)?$ ]]; then
            echo "DAILY_VISIT_REPORT_EMAIL_URL secret does not point to /api/cron/daily-visit-report-email; falling back to default endpoint."
            DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE="$DEFAULT_DAILY_VISIT_REPORT_EMAIL_URL"
          fi

          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          CRON_SECRET_TRIMMED="$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          REPORT_DATE_TRIMMED="$(printf '%s' "$REPORT_DATE" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          DIGEST_ONLY_TO_TRIMMED="$(printf '%s' "$DIGEST_ONLY_TO" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          BODY='{}'
          if [[ -n "$REPORT_DATE_TRIMMED" && -n "$DIGEST_ONLY_TO_TRIMMED" ]]; then
            BODY="$(printf '{"date":"%s","digestOnlyTo":"%s"}' "$REPORT_DATE_TRIMMED" "$DIGEST_ONLY_TO_TRIMMED")"
          elif [[ -n "$REPORT_DATE_TRIMMED" ]]; then
            BODY="$(printf '{"date":"%s"}' "$REPORT_DATE_TRIMMED")"
          elif [[ -n "$DIGEST_ONLY_TO_TRIMMED" ]]; then
            BODY="$(printf '{"digestOnlyTo":"%s"}' "$DIGEST_ONLY_TO_TRIMMED")"
          fi

          post_report() {
            local target_url="$1"
            curl -sS -L --post301 --post302 --post303 --max-time 180 -o response.json -w "%{http_code}" -X POST "$target_url" \
              -H "x-cron-secret: $CRON_SECRET_TRIMMED" \
              -H "Content-Type: application/json" \
              --data "$BODY"
          }

          status_code="$(post_report "$DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE")"

          if [[ ("$status_code" -lt 200 || "$status_code" -ge 300) && "$DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE" != "$DEFAULT_DAILY_VISIT_REPORT_EMAIL_URL" ]]; then
            echo "Primary DAILY_VISIT_REPORT_EMAIL_URL failed with HTTP $status_code; retrying default endpoint."
            DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE="$DEFAULT_DAILY_VISIT_REPORT_EMAIL_URL"
            status_code="$(post_report "$DAILY_VISIT_REPORT_EMAIL_URL_EFFECTIVE")"
          fi

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            echo "Daily visit report email failed with HTTP $status_code"
            cat response.json
            exit 1
          fi

          echo "Daily visit report email succeeded with HTTP $status_code"
          cat response.json
