name: Inter-city Stock Gap Email

on:
  schedule:
    # 05:40 UTC = 08:40 KSA, Saturday–Thursday — daily stock gap digest (cartons).
    - cron: "40 5 * * 0-4,6"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date YYYY-MM-DD (KSA). Empty = today KSA."
        required: false
        default: ""
      to:
        description: "Test-only recipient override (skips default digest list)."
        required: false
        default: ""
      force:
        description: "Force send even if already marked sent"
        required: false
        default: "true"

permissions: {}

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger inter-city stock gap email endpoint
        env:
          INTER_CITY_STOCK_EMAIL_URL: ${{ secrets.INTER_CITY_STOCK_EMAIL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_TO: ${{ github.event.inputs.to }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          DEFAULT_INTER_CITY_STOCK_EMAIL_URL='https://madiba-sfa.vercel.app/api/cron/inter-city-stock-email'
          INTER_CITY_STOCK_EMAIL_URL_TRIMMED="$(printf '%s' "$INTER_CITY_STOCK_EMAIL_URL" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE="$INTER_CITY_STOCK_EMAIL_URL_TRIMMED"

          if [[ -z "$INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE" ]]; then
            echo "INTER_CITY_STOCK_EMAIL_URL secret is missing; falling back to default endpoint."
            INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE="$DEFAULT_INTER_CITY_STOCK_EMAIL_URL"
          elif [[ ! "$INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE" =~ /api/cron/inter-city-stock-email([/?].*)?$ ]]; then
            echo "INTER_CITY_STOCK_EMAIL_URL secret does not point to /api/cron/inter-city-stock-email; falling back to default endpoint."
            INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE="$DEFAULT_INTER_CITY_STOCK_EMAIL_URL"
          fi

          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          CRON_SECRET_TRIMMED="$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          export EVENT_NAME
          export FORCE_VALUE="${INPUT_FORCE:-}"
          export DATE_VALUE="$(printf '%s' "$INPUT_DATE" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export TO_VALUE="$(printf '%s' "$INPUT_TO" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          python3 - <<'PY' > payload.json
          import json, os
          event_name = os.environ.get("EVENT_NAME", "").strip()
          force_raw = os.environ.get("FORCE_VALUE", "").strip().lower()
          if event_name == "schedule":
            force = False
            trigger = "cron"
          elif force_raw:
            force = force_raw not in ("0", "false", "no")
            trigger = "manual"
          else:
            force = True
            trigger = "manual"
          payload = {"force": force, "trigger": trigger}
          date = os.environ.get("DATE_VALUE", "").strip()
          to = os.environ.get("TO_VALUE", "").strip()
          if date:
            payload["date"] = date
          if to:
            payload["to"] = to
          print(json.dumps(payload))
          PY

          echo "Request payload:"
          cat payload.json

          post_report() {
            local target_url="$1"
            curl -sS -L --post301 --post302 --post303 --max-time 300 -o response.json -w "%{http_code}" -X POST "$target_url" \
              -H "x-cron-secret: $CRON_SECRET_TRIMMED" \
              -H "Content-Type: application/json" \
              --data @payload.json
          }

          status_code="$(post_report "$INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE")"

          if [[ ("$status_code" -lt 200 || "$status_code" -ge 300) && "$INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE" != "$DEFAULT_INTER_CITY_STOCK_EMAIL_URL" ]]; then
            echo "Primary INTER_CITY_STOCK_EMAIL_URL failed with HTTP $status_code; retrying default endpoint."
            INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE="$DEFAULT_INTER_CITY_STOCK_EMAIL_URL"
            status_code="$(post_report "$INTER_CITY_STOCK_EMAIL_URL_EFFECTIVE")"
          fi

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            echo "Inter-city stock gap email failed with HTTP $status_code"
            cat response.json
            exit 1
          fi

          echo "Inter-city stock gap email succeeded with HTTP $status_code"
          cat response.json
