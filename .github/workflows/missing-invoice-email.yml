name: Missing Invoice Email

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger missing invoice email endpoint
        env:
          MISSING_INVOICE_EMAIL_URL: ${{ secrets.MISSING_INVOICE_EMAIL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          DEFAULT_MISSING_INVOICE_EMAIL_URL='https://madiba-sfa.vercel.app/api/cron/missing-invoice-email'
          MISSING_INVOICE_EMAIL_URL_TRIMMED="$(printf '%s' "$MISSING_INVOICE_EMAIL_URL" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          MISSING_INVOICE_EMAIL_URL_EFFECTIVE="$MISSING_INVOICE_EMAIL_URL_TRIMMED"

          if [[ -z "$MISSING_INVOICE_EMAIL_URL_EFFECTIVE" ]]; then
            echo "MISSING_INVOICE_EMAIL_URL secret is missing; falling back to default endpoint."
            MISSING_INVOICE_EMAIL_URL_EFFECTIVE="$DEFAULT_MISSING_INVOICE_EMAIL_URL"
          elif [[ ! "$MISSING_INVOICE_EMAIL_URL_EFFECTIVE" =~ /api/cron/missing-invoice-email([/?].*)?$ ]]; then
            echo "MISSING_INVOICE_EMAIL_URL secret does not point to /api/cron/missing-invoice-email; falling back to default endpoint."
            MISSING_INVOICE_EMAIL_URL_EFFECTIVE="$DEFAULT_MISSING_INVOICE_EMAIL_URL"
          fi

          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          CRON_SECRET_TRIMMED="$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          post_report() {
            local target_url="$1"
            curl -sS -L --post301 --post302 --post303 --max-time 180 -o response.json -w "%{http_code}" -X POST "$target_url" \
              -H "x-cron-secret: $CRON_SECRET_TRIMMED" \
              -H "Content-Type: application/json" \
              --data '{}'
          }

          status_code="$(post_report "$MISSING_INVOICE_EMAIL_URL_EFFECTIVE")"

          if [[ ("$status_code" -lt 200 || "$status_code" -ge 300) && "$MISSING_INVOICE_EMAIL_URL_EFFECTIVE" != "$DEFAULT_MISSING_INVOICE_EMAIL_URL" ]]; then
            echo "Primary MISSING_INVOICE_EMAIL_URL failed with HTTP $status_code; retrying default endpoint."
            MISSING_INVOICE_EMAIL_URL_EFFECTIVE="$DEFAULT_MISSING_INVOICE_EMAIL_URL"
            status_code="$(post_report "$MISSING_INVOICE_EMAIL_URL_EFFECTIVE")"
          fi

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            echo "Missing invoice email failed with HTTP $status_code"
            cat response.json
            exit 1
          fi

          echo "Missing invoice email succeeded with HTTP $status_code"
          cat response.json
