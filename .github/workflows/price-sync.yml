name: Price Sync

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream price payload
        env:
          PRICE_SOURCE_URL: ${{ secrets.PRICE_SOURCE_URL || 'https://script.google.com/macros/s/AKfycbwmgoTXNLgIVM_HyVl3iwnfmhqmqjvJcIriCDtZAc0FDgvBbslYmmmC8-h2P2I0RH6f/exec' }}
        run: |
          http_code="$(curl -sS -L -o upstream-price.json -w "%{http_code}" "$PRICE_SOURCE_URL")"

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Upstream price source failed with HTTP $http_code"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("upstream-price.json", "utf8");
            let payload;
            try {
              payload = JSON.parse(raw);
            } catch (e) {
              const snippet = raw.slice(0, 200).replace(/\s+/g, " ").trim();
              console.error("Upstream price source returned non-JSON content. First bytes: " + snippet);
              process.exit(1);
            }
            fs.writeFileSync("price-sync-body.json", JSON.stringify({ payload }));
          '

      - name: Trigger price sync endpoint
        env:
          PRICE_SYNC_URL: ${{ secrets.PRICE_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$PRICE_SYNC_URL" ]]; then
            echo "PRICE_SYNC_URL secret is missing"
            exit 1
          fi

          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          # Guard against accidental leading/trailing whitespace in pasted secrets.
          CRON_SECRET_TRIMMED="$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          status_code="$(curl -sS -o response.json -w "%{http_code}" -X POST "$PRICE_SYNC_URL" \
            -H "x-cron-secret: $CRON_SECRET_TRIMMED" \
            -H "Content-Type: application/json" \
            --data-binary @price-sync-body.json)"

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            echo "Price sync failed with HTTP $status_code"
            cat response.json
            exit 1
          fi

          echo "Price sync succeeded with HTTP $status_code"
          cat response.json
