name: Price Sync

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream price payload
        run: |
          SOURCE_URL='https://script.google.com/macros/s/AKfycbwmgoTXNLgIVM_HyVl3iwnfmhqmqjvJcIriCDtZAc0FDgvBbslYmmmC8-h2P2I0RH6f/exec'
          status_code="$(curl -sS -L -o upstream-price.json -w "%{http_code}" "$SOURCE_URL")" || {
            echo "ERROR: curl failed to fetch upstream price data (HTTP error or network failure)."
            echo "Response body (first 500 chars):"
            head -c 500 upstream-price.json 2>/dev/null || true
            exit 1
          }

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            echo "Upstream fetch failed with HTTP $status_code"
            cat upstream-price.json
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("upstream-price.json", "utf8");
            let payload;
            try {
              payload = JSON.parse(raw);
            } catch (e) {
              console.error("Upstream response is not valid JSON. Response body:");
              console.error(raw.slice(0, 2000));
              process.exit(1);
            }
            fs.writeFileSync("price-sync-body.json", JSON.stringify({ payload }));
          '

      - name: Trigger price sync endpoint
        env:
          PRICE_SYNC_URL: ${{ secrets.PRICE_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          DEFAULT_PRICE_SYNC_URL='https://madiba-sfa.vercel.app/api/admin/price-sync'
          PRICE_SYNC_URL_TRIMMED="$(printf '%s' "$PRICE_SYNC_URL" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PRICE_SYNC_URL_EFFECTIVE="$PRICE_SYNC_URL_TRIMMED"

          if [[ -z "$PRICE_SYNC_URL_EFFECTIVE" ]]; then
            echo "PRICE_SYNC_URL secret is missing; falling back to default endpoint."
            PRICE_SYNC_URL_EFFECTIVE="$DEFAULT_PRICE_SYNC_URL"
          elif [[ ! "$PRICE_SYNC_URL_EFFECTIVE" =~ /api/admin/price-sync([/?].*)?$ ]]; then
            echo "PRICE_SYNC_URL secret does not point to /api/admin/price-sync; falling back to default endpoint."
            PRICE_SYNC_URL_EFFECTIVE="$DEFAULT_PRICE_SYNC_URL"
          fi

          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          # Guard against accidental leading/trailing whitespace in pasted secrets.
          CRON_SECRET_TRIMMED="$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          status_code="$(curl -sS -L --post301 --post302 --post303 -o response.json -w "%{http_code}" -X POST "$PRICE_SYNC_URL_EFFECTIVE" \
            -H "x-cron-secret: $CRON_SECRET_TRIMMED" \
            -H "Content-Type: application/json" \
            --data-binary @price-sync-body.json)"

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            echo "Price sync failed with HTTP $status_code"
            cat response.json
            exit 1
          fi

          echo "Price sync succeeded with HTTP $status_code"
          cat response.json
