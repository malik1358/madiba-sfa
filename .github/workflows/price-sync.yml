name: Price Sync

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream price payload
        run: |
          SOURCE_URL='https://script.google.com/macros/s/AKfycbwmgoTXNLgIVM_HyVl3iwnfmhqmqjvJcIriCDtZAc0FDgvBbslYmmmC8-h2P2I0RH6f/exec'
          curl -sS -L --fail-with-body "$SOURCE_URL" -o upstream-price.json || {
            echo "ERROR: curl failed to fetch upstream price data (HTTP error or network failure)."
            echo "Response body (first 500 chars):"
            head -c 500 upstream-price.json 2>/dev/null || true
            exit 1
          }

          if ! node -e 'JSON.parse(require("fs").readFileSync("upstream-price.json","utf8"))' 2>/dev/null; then
            echo "ERROR: upstream-price.json is not valid JSON. The upstream URL may be returning an error page."
            echo "Response body (first 500 chars):"
            head -c 500 upstream-price.json
            exit 1
          fi

          node -e 'const fs = require("fs"); const payload = JSON.parse(fs.readFileSync("upstream-price.json", "utf8")); fs.writeFileSync("price-sync-body.json", JSON.stringify({ payload }));'

      - name: Trigger price sync endpoint
        env:
          PRICE_SYNC_URL: ${{ secrets.PRICE_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$PRICE_SYNC_URL" ]]; then
            echo "PRICE_SYNC_URL secret is missing"
            exit 1
          fi

          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          # Guard against accidental leading/trailing whitespace in pasted secrets.
          CRON_SECRET_TRIMMED="$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          status_code="$(curl -sS -o response.json -w "%{http_code}" -X POST "$PRICE_SYNC_URL" \
            -H "x-cron-secret: $CRON_SECRET_TRIMMED" \
            -H "Content-Type: application/json" \
            --data-binary @price-sync-body.json)"

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            echo "Price sync failed with HTTP $status_code"
            cat response.json
            exit 1
          fi

          echo "Price sync succeeded with HTTP $status_code"
          cat response.json
