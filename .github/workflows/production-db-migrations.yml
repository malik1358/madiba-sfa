name: Production DB migrations
run-name: Production DB migrations (${{ inputs.mode }} @ ${{ inputs.reviewed_commit }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight by default; apply is separately gated
        type: choice
        options:
          - preflight
          - apply
        default: preflight
        required: true
      reviewed_commit:
        description: Full 40-character main commit SHA reviewed for this run
        type: string
        required: true
      preflight_run_id:
        description: Successful preflight workflow run ID (required for apply)
        type: string
        required: false
      execution_confirmation:
        description: Type APPLY followed by the exact reviewed commit SHA (required for apply)
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: production-db-migrations-${{ inputs.reviewed_commit }}
  cancel-in-progress: false

jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-db
    env:
      PRODUCTION_DB_MIGRATION_MODE: ${{ inputs.mode }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      PRODUCTION_DB_PROJECT_REF: ${{ vars.PRODUCTION_DB_PROJECT_REF || 'ynmtlzyqvmurpmfretji' }}
      PRODUCTION_DB_MIGRATIONS_ENABLED: ${{ vars.PRODUCTION_DB_MIGRATIONS_ENABLED || 'false' }}
      EXECUTION_CONFIRMATION: ${{ inputs.execution_confirmation }}
      PREVIOUS_PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.reviewed_commit }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Verify reviewed commit is current main
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ ! "$REVIEWED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "reviewed_commit must be a full 40-character SHA" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_SHA" != "$REVIEWED_COMMIT" || "$checked_out_sha" != "$REVIEWED_COMMIT" || "$current_main_sha" != "$REVIEWED_COMMIT" ]]; then
            echo "reviewed commit, dispatch SHA, checkout, and current main must match exactly" >&2
            exit 1
          fi
          {
            echo "checked_out_sha=$checked_out_sha"
            echo "current_main_sha=$current_main_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify a successful matching preflight for apply mode
        if: inputs.mode == 'apply'
        id: approved_preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PREVIOUS_PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "apply requires the run ID of a successful preflight for this commit" >&2
            exit 1
          fi
          run_json="$(gh run view "$PREVIOUS_PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json event,conclusion,headSha,displayTitle,workflowName)"
          jq -e --arg sha "$REVIEWED_COMMIT" '
            .event == "workflow_dispatch" and
            .conclusion == "success" and
            .headSha == $sha and
            .workflowName == "Production DB migrations" and
            (.displayTitle | startswith("Production DB migrations (preflight @ " + $sha + ")"))
          ' <<< "$run_json" >/dev/null || {
            echo "prior run is not a successful preflight for the reviewed commit" >&2
            exit 1
          }
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "supabase@2.120.0"
          version="$(supabase --version)"
          if [[ "$version" != "2.120.0" ]]; then
            echo "unexpected Supabase CLI version" >&2
            exit 1
          fi

      - name: Run read-only preflight or gated allowlisted apply
        id: migration_runner
        env:
          CHECKED_OUT_SHA: ${{ steps.revision.outputs.checked_out_sha }}
          CURRENT_MAIN_SHA: ${{ steps.revision.outputs.current_main_sha }}
          PREVIOUS_PREFLIGHT_VERIFIED: ${{ steps.approved_preflight.outputs.verified || 'false' }}
          PRODUCTION_DB_READONLY_URL: ${{ secrets.PRODUCTION_DB_READONLY_URL }}
          PRODUCTION_DB_MIGRATION_URL: ${{ inputs.mode == 'apply' && secrets.PRODUCTION_DB_MIGRATION_URL || '' }}
        run: node scripts/productionDbMigrations.mjs

      - name: Record fallback audit summary if runner did not start
        if: always() && steps.migration_runner.outcome != 'success'
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production database migration workflow (fallback audit)"
            echo
            echo "- Triggering GitHub user: $GITHUB_ACTOR"
            echo "- Reviewed commit SHA: $REVIEWED_COMMIT"
            echo "- Target Supabase project: $PRODUCTION_DB_PROJECT_REF"
            echo "- Mode: $PRODUCTION_DB_MIGRATION_MODE"
            echo "- Execution status: **not executed; job status $JOB_STATUS**"
            echo "- Migrations: 20260930190000, 20261002120000, 20261002130000"
          } >> "$GITHUB_STEP_SUMMARY"