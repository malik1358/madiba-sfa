name: Switch historical attachment reads to R2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: check before the switch, or confirm after it
        required: true
        default: check
        type: choice
        options:
          - check
          - confirm
          - legacy

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check or confirm historical R2 reads
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi
          post() {
            curl -sS -L --post301 --post302 --post303 --max-time 75 -o response.json -w "%{http_code}" -X POST \
              "https://madiba-sfa.vercel.app/api/cron/switch-historical-reads" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data "{\"mode\":\"${MODE}\"}"
          }
          for i in $(seq 1 40); do
            set +e
            code="$(post)"
            status=$?
            set -e
            if [[ "$status" != "0" ]]; then
              code="000"
            fi
            echo "mode=${MODE} batch=${i} http=${code}"
            if [[ "$code" == "502" || "$code" == "503" || "$code" == "504" || "$code" == "000" ]]; then
              echo "gateway timeout; saved progress will be resumed"
              sleep 8
              continue
            fi
            set +e
            node --input-type=module -e "import fs from 'node:fs'; const raw=fs.readFileSync('response.json','utf8'); let body; try { body=JSON.parse(raw); } catch { console.log(raw.slice(0,180)); process.exit(4); } console.log(JSON.stringify({success:body.success,done:body.done,stop:body.stop,stopReason:body.stopReason,mode:body.mode,eligible:body.eligible,checked:body.checked,remaining:body.remaining,switched:body.switched,historicalStillSupabase:body.historicalStillSupabase,newVerified:body.newVerified,newUnverified:body.newUnverified,receiptR2:body.receiptR2,receiptSupabase:body.receiptSupabase,paymentR2:body.paymentR2,paymentSupabase:body.paymentSupabase,receiptBroken:body.receiptBroken,paymentBroken:body.paymentBroken,writeProvider:body.writeProvider,forceSupabaseReads:body.forceSupabaseReads,probes:body.probes,reads:body.reads,legacy:body.legacy,rollbackOk:body.rollbackOk,error:body.error,failures:(body.failures||[]).slice(0,5)})); if(body.stop) process.exit(2); if(body.success && (body.done || body.mode==='confirm' || body.mode==='legacy')) process.exit(0); if(body.success) process.exit(3); process.exit(1);"
            status=$?
            set -e
            if [[ "$status" == "4" ]]; then
              echo "response was not JSON; retrying"
              sleep 8
              continue
            fi
            if [[ "$status" == "0" ]]; then
              exit 0
            fi
            if [[ "$status" == "3" ]]; then
              continue
            fi
            exit "$status"
          done
          echo "${MODE} did not finish"
          exit 1
