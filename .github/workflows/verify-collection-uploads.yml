name: Verify newer collection uploads in R2

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checksum unverified receipt and payment uploads
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi
          post() {
            local mode="$1"
            curl -sS -L --post301 --post302 --post303 --max-time 75 -o response.json -w "%{http_code}" -X POST \
              "https://madiba-sfa.vercel.app/api/cron/verify-collection-uploads" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data "{\"mode\":\"${mode}\"}"
          }
          run_mode() {
            local mode="$1"
            local i code status attempt
            for i in $(seq 1 40); do
              for attempt in 1 2 3 4 5 6; do
                set +e
                code="$(post "$mode")"
                status=$?
                set -e
                if [[ "$status" != "0" ]]; then
                  code="000"
                fi
                echo "mode=${mode} batch=${i} attempt=${attempt} http=${code}"
                if [[ "$code" == "502" || "$code" == "503" || "$code" == "504" || "$code" == "000" ]]; then
                  echo "gateway timeout; saved progress will be resumed"
                  sleep 8
                  continue
                fi
                set +e
                node --input-type=module -e "import fs from 'node:fs'; const raw=fs.readFileSync('response.json','utf8'); let body; try { body=JSON.parse(raw); } catch { console.log(raw.slice(0,180)); process.exit(4); } console.log(JSON.stringify({success:body.success,done:body.done,stop:body.stop,stopReason:body.stopReason,mode:body.mode,attempted:body.attempted,updated:body.updated,failed:body.failed,pending:body.pending,remaining:body.remaining,permanentFailures:body.permanentFailures,unverified:body.unverified,unverifiedReceipts:body.unverifiedReceipts,unverifiedPayments:body.unverifiedPayments,verified:body.verified,datedVerified:body.datedVerified,links:body.links,supabaseReceiptStatus:body.supabaseReceiptStatus,supabasePaymentStatus:body.supabasePaymentStatus,r2UnsignedStatus:body.r2UnsignedStatus,attachmentAnonymousStatus:body.attachmentAnonymousStatus,error:body.error,failures:(body.failures||body.storedFailures||[]).slice(0,8)})); if(body.stop) process.exit(2); if(body.mode==='verify' && body.attempted===0 && body.remaining>0) process.exit(2); if(body.success && (body.done || body.mode==='privacy' || body.mode==='reconcile')) process.exit(0); if(body.success) process.exit(3); process.exit(1);"
                status=$?
                set -e
                if [[ "$status" == "4" ]]; then
                  echo "response was not JSON; retrying"
                  sleep 8
                  continue
                fi
                if [[ "$status" == "0" ]]; then
                  return 0
                fi
                if [[ "$status" == "3" ]]; then
                  break
                fi
                return "$status"
              done
              if [[ "$status" == "3" ]]; then
                continue
              fi
              echo "${mode} batch ${i} failed after retries"
              return 1
            done
            echo "${mode} did not finish"
            return 1
          }
          verify_status=0
          run_mode verify || verify_status=$?
          run_mode reconcile || verify_status=$?
          run_mode privacy || verify_status=$?
          exit "$verify_status"
